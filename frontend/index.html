<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fossil-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaleoLocal - Interactive Paleontological Site Map</title>
    <meta name="description" content="Discover paleontological sites near you with our interactive map. Explore fossil sites, formations, and geological history." />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- OpenGraph and Twitter Card tags for social sharing -->
    <meta property="og:title" content="PaleoLocal - Interactive Paleontological Site Map" />
    <meta property="og:description" content="Discover paleontological sites near you with our interactive map" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaleoLocal - Interactive Paleontological Site Map" />
    <meta name="twitter:description" content="Discover paleontological sites near you with our interactive map" />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#2c3e50" />
    
    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Progressive Web App manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <style>
      /* Critical CSS for initial load */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f8f9fa;
        color: #2c3e50;
        line-height: 1.6;
      }
      
      #root {
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }
      
      /* Loading spinner for initial app load */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f8f9fa;
      }
      
      .app-loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e3e3e3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .app-loading-text {
        margin-top: 20px;
        font-size: 16px;
        color: #666;
        font-weight: 500;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading when app is ready */
      .app-ready .app-loading {
        display: none;
      }
      
      /* Error fallback styles */
      .app-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f8f9fa;
        padding: 20px;
        text-align: center;
      }
      
      .app-error h1 {
        color: #e74c3c;
        margin-bottom: 16px;
        font-size: 24px;
      }
      
      .app-error p {
        color: #666;
        margin-bottom: 20px;
        max-width: 400px;
      }
      
      .app-error button {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      
      .app-error button:hover {
        background: #2980b9;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading indicator -->
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">Loading PaleoLocal...</div>
      </div>
    </div>
    
    <!-- Error boundary fallback (will be replaced by React) -->
    <script>
      // Simple error handler for initial load failures
      window.addEventListener('error', function(e) {
        const root = document.getElementById('root');
        if (root && !root.classList.contains('app-ready')) {
          root.innerHTML = `
            <div class="app-error">
              <h1>Failed to Load</h1>
              <p>There was a problem loading PaleoLocal. Please check your internet connection and try again.</p>
              <button onclick="window.location.reload()">Reload Page</button>
            </div>
          `;
        }
      });
      
      // Mark app as ready when React takes over
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          const root = document.getElementById('root');
          if (root && root.children.length > 1) {
            root.classList.add('app-ready');
          }
        }, 5000); // Fallback timeout
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
